<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volant · Current Refined</title>
  <style>
    :root {
      color-scheme: light;
      --board-bg: #e9eaec;
      --board-surface: #f8f9f9;
      --ink: #111518;
      --muted: #59626b;
      --line: #d2d6da;
      --accent: #2f6bff;
      font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body { min-width: 1180px; overflow: hidden; color: var(--ink); background: var(--board-bg); }
    button, input, select { font: inherit; }
    button { color: inherit; }
    svg { display: block; flex: 0 0 auto; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .board {
      width: min(1600px, calc(100vw - 36px));
      height: calc(100vh - 36px);
      margin: 18px auto;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 12px;
    }
    .masthead {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      padding: 0 2px;
    }
    .masthead h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.1;
      font-weight: 650;
      letter-spacing: -.025em;
    }
    .masthead p { margin: 7px 0 0; color: var(--muted); font-size: 12px; }
    .board-meta { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .board-mark {
      width: 32px; height: 32px; display: grid; place-items: center;
      border: 1px solid #c9cdd1; border-radius: 9px; color: #fff;
      background: #12171c; font-size: 12px; font-weight: 800;
    }
    .variants { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .variant {
      min-width: 0;
      display: grid;
      grid-template-columns: 39px 1fr auto;
      align-items: center;
      gap: 11px;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 11px;
      color: var(--ink);
      background: rgba(251,251,250,.74);
      text-align: left;
      cursor: pointer;
    }
    .variant:hover { background: #fff; }
    .variant.active { border-color: #a7aeb4; background: #fff; box-shadow: 0 5px 16px rgba(18,24,29,.07); }
    .variant-index {
      width: 39px; height: 39px; display: grid; place-items: center;
      border-radius: 10px; color: color-mix(in srgb, var(--ink) 65%, transparent);
      background: color-mix(in srgb, var(--accent) 8%, #fff);
      font-size: 12px; font-weight: 750;
    }
    .variant-copy { min-width: 0; }
    .variant-copy strong { display: block; color: #121619; font-size: 12.5px; font-weight: 650; }
    .variant-copy span {
      display: block; margin-top: 3px; overflow: hidden; color: #687079;
      font-size: 10.5px; text-overflow: ellipsis; white-space: nowrap;
    }
    .library {
      padding: 4px 7px;
      border: 1px solid #d3d7da;
      border-radius: 5px;
      color: #59626b;
      background: rgba(255,255,255,.7);
      font-size: 9.5px;
      white-space: nowrap;
    }
    .stage {
      min-height: 0;
      display: grid;
      grid-template-rows: 39px minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid #b9bfc4;
      border-radius: 14px;
      background: #f5f6f6;
    }
    .stage-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 9px 0 12px;
      border-bottom: 1px solid #cfd4d8;
      background: #f8f9f9;
    }
    .screen-tabs, .theme-switch { display: flex; align-items: center; gap: 3px; }
    .screen-tab, .theme-button {
      height: 28px; display: flex; align-items: center; gap: 6px;
      border: 0; border-radius: 6px; padding: 0 10px;
      color: #5c656e; background: transparent; font-size: 10.5px; cursor: pointer;
    }
    .screen-tab:hover, .theme-button:hover { background: rgba(17,21,24,.05); }
    .screen-tab.active, .theme-button.active { color: #14181c; background: #fff; box-shadow: 0 1px 4px rgba(17,22,28,.1); }
    .theme-switch { padding-left: 7px; border-left: 1px solid #d6dade; }
    .stage-canvas {
      min-height: 0;
      padding: 13px;
      overflow: auto;
      display: grid;
      place-items: stretch;
      background: #dfe2e4;
    }
    .stack-frame {
      position: relative;
      pointer-events: none;
      border: 1px solid #9da8b2;
      border-radius: 12px;
      background: #fff;
      transform: translate(8px, 8px);
      opacity: .24;
    }
    .stack-frame::after {
      content: "";
      position: absolute;
      inset: 7px -7px -7px 7px;
      z-index: -1;
      border: 1px solid #b5bdc4;
      border-radius: 12px;
    }

    .prototype {
      --bg: #ffffff;
      --chrome: #f7f8fa;
      --surface: #ffffff;
      --rail: #f7f8fa;
      --panel: #f3f5f7;
      --hover: #f3f4f6;
      --selected: #eaf0ff;
      --selected-border: #b8caf8;
      --text: #111417;
      --muted: #59626b;
      --faint: #68737c;
      --line: #e1e4e7;
      --line-strong: #cad0d6;
      --accent: #2f6bff;
      --accent-soft: #edf2ff;
      --primary: #14191d;
      --primary-text: #ffffff;
      --success: #16765a;
      --warning: #94621c;
      --danger: #b3423d;
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      color: var(--text);
    }
    .prototype[data-theme="dark"] {
      --bg: #0e1319;
      --chrome: #111821;
      --surface: #121a23;
      --rail: #101720;
      --panel: #17212c;
      --hover: #1b2632;
      --selected: #172947;
      --selected-border: #2f4b78;
      --text: #edf2f6;
      --muted: #a5afb9;
      --faint: #8d99a4;
      --line: #26313d;
      --line-strong: #394858;
      --accent: #7da4ff;
      --accent-soft: #172846;
      --primary: #edf2f6;
      --primary-text: #10161d;
      --success: #66c9a5;
      --warning: #e1b56d;
      --danger: #ff8a84;
    }
    .app {
      width: 100%; height: 100%; min-height: 0;
      display: flex; flex-direction: column; overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      color: var(--text);
      background: var(--bg);
      box-shadow: 0 18px 52px rgba(14,19,24,.16), 0 2px 8px rgba(14,19,24,.08);
    }
    .app.float { width: auto; height: auto; }
    .titlebar {
      height: 34px; flex: 0 0 34px; display: flex; align-items: center; justify-content: space-between;
      padding-left: 12px; border-bottom: 1px solid var(--line); color: var(--muted); background: var(--chrome);
      user-select: none;
    }
    .title-label { display: flex; align-items: center; gap: 7px; font-size: 10.5px; font-weight: 600; }
    .mini-mark {
      width: 17px; height: 17px; display: grid; place-items: center;
      border-radius: 4px; color: var(--primary-text); background: var(--primary);
      font-size: 8px; font-weight: 800;
    }
    .window-actions { height: 100%; display: flex; }
    .window-action {
      width: 39px; display: grid; place-items: center;
      border-left: 1px solid transparent;
    }
    .window-action:hover { background: color-mix(in srgb, var(--text) 7%, transparent); }
    .window-action.close:hover { color: #fff; background: #c64343; }
    .window-action svg { width: 10px; height: 10px; }
    .btn {
      min-height: 31px; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      border-radius: 7px; padding: 0 11px; border: 1px solid transparent;
      font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .btn.primary { color: var(--primary-text); background: var(--primary); border-color: var(--primary); }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn.secondary { color: var(--text); background: var(--surface); border-color: var(--line-strong); }
    .btn.secondary:hover { background: var(--hover); }
    .btn.ghost { color: var(--muted); background: transparent; }
    .btn.ghost:hover { color: var(--text); background: var(--hover); }
    .status { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 10.5px; white-space: nowrap; }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status.active { color: var(--accent); }
    .status.queued { color: var(--faint); }
    .status.paused { color: var(--warning); }
    .status.done { color: var(--success); }
    .status.failed { color: var(--danger); }
    .mono { font-family: "Cascadia Mono", "Consolas", monospace; font-variant-numeric: tabular-nums; }
    .file { min-width: 0; display: flex; align-items: center; gap: 10px; }
    .file-icon { width: 27px; height: 29px; display: grid; place-items: center; flex: 0 0 27px; color: var(--faint); }
    .file-copy { min-width: 0; }
    .file-name {
      overflow: hidden; color: var(--text); font-size: 12px; font-weight: 580;
      line-height: 1.35; text-overflow: ellipsis; white-space: nowrap;
    }
    .file-sub {
      margin-top: 3px; overflow: hidden; color: var(--faint); font-size: 9.5px;
      line-height: 1.3; text-overflow: ellipsis; white-space: nowrap;
    }
    .track { height: 3px; overflow: hidden; border-radius: 20px; background: var(--line); }
    .track i { display: block; width: var(--p); height: 100%; background: var(--accent); }
    .switch {
      width: 32px; height: 18px; padding: 2px; border: 0; border-radius: 99px;
      background: var(--line-strong); cursor: pointer;
    }
    .switch::after {
      content: ""; display: block; width: 14px; height: 14px; border-radius: 50%;
      background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.18);
    }
    .switch.on { background: var(--primary); }
    .switch.on::after { transform: translateX(14px); }
    .switch.transit.on { background: var(--accent); }
    .switch.ely { border-radius: 999px; }
    .switch.ely.on { background: var(--accent); }
    .app.air .btn { border-radius: 999px; }
    .app.grid .btn { border-radius: 4px; }
    .app.grid .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .app.grid .switch { border-radius: 3px; }
    .app.grid .switch::after { border-radius: 1px; }

    /* Variant 1: Kit Current */
    .kit-shell { flex: 1; min-height: 0; display: flex; }
    .kit-rail {
      width: 202px; flex: 0 0 202px; padding: 15px 11px 12px;
      display: flex; flex-direction: column;
      border-right: 1px solid var(--line); background: var(--rail);
    }
    .brand { display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 650; }
    .brand-mark {
      width: 26px; height: 26px; display: grid; place-items: center;
      border-radius: 7px; color: var(--primary-text); background: var(--primary);
      font-size: 11px; font-weight: 800;
    }
    .kit-brand { padding: 0 7px 14px; }
    .kit-rail .btn.primary { width: 100%; margin-bottom: 14px; }
    .nav-label { padding: 0 8px 7px; color: var(--faint); font-size: 9.5px; font-weight: 650; }
    .nav-list { display: grid; gap: 2px; }
    .nav-item {
      width: 100%; min-height: 32px; display: flex; align-items: center; gap: 8px;
      padding: 0 9px; border: 1px solid transparent; border-radius: 7px;
      color: var(--muted); background: transparent; font-size: 10.5px; text-align: left; cursor: pointer;
    }
    .nav-item:hover { color: var(--text); background: var(--hover); }
    .nav-item.active { color: var(--text); background: var(--panel); border-color: var(--line); }
    .nav-item .count { margin-left: auto; color: var(--faint); font-size: 9px; }
    .kit-rail-footer { margin-top: auto; display: grid; gap: 4px; }
    .kit-main { flex: 1; min-width: 0; min-height: 0; padding: 20px 20px 16px; display: flex; flex-direction: column; background: var(--bg); }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; }
    h1 { margin: 0; font-size: 24px; line-height: 1.15; font-weight: 630; letter-spacing: -.02em; }
    .sub { margin: 5px 0 0; color: var(--muted); font-size: 10.5px; line-height: 1.45; }
    .speed-mini { color: var(--muted); font-size: 10.5px; white-space: nowrap; }
    .speed-mini b { color: var(--text); font-size: 13px; font-weight: 600; }
    .flow-band {
      margin-top: 15px; padding: 12px 14px;
      display: grid; grid-template-columns: 150px 1fr auto; gap: 18px; align-items: center;
      border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
    }
    .speed-big { display: flex; align-items: baseline; gap: 6px; }
    .speed-big strong { font-family: "Cascadia Mono", "Consolas", monospace; font-size: 20px; font-weight: 500; letter-spacing: -.03em; }
    .speed-big span { color: var(--muted); font-size: 9.5px; }
    .lanes { height: 27px; display: flex; align-items: end; gap: 3px; }
    .lanes i {
      flex: 1; height: var(--h); min-width: 3px; border-radius: 2px 2px 0 0;
      background: var(--accent); opacity: var(--o);
    }
    .flow-meta { display: grid; grid-template-columns: auto auto; gap: 3px 14px; color: var(--muted); font-size: 9.5px; text-align: right; }
    .flow-meta b { color: var(--text); font-weight: 550; }
    .kit-list { flex: 1; min-height: 0; margin-top: 12px; overflow: hidden; border-top: 1px solid var(--line-strong); }
    .list-head {
      height: 29px; display: grid;
      grid-template-columns: minmax(240px,1fr) 150px 70px 76px;
      gap: 12px; align-items: center; color: var(--faint); font-size: 9px;
    }
    .transfer-row {
      min-height: 61px; display: grid;
      grid-template-columns: minmax(240px,1fr) 150px 70px 76px;
      gap: 12px; align-items: center;
      padding: 8px 9px;
      border-top: 1px solid var(--line);
      border-radius: 6px;
    }
    .transfer-row.selected { background: var(--selected); box-shadow: inset 0 0 0 1px var(--selected-border); }
    .progress-cell { display: grid; gap: 5px; }
    .progress-top { display: flex; justify-content: space-between; color: var(--muted); font-size: 9px; }
    .mini-lanes { display: grid; grid-template-columns: repeat(8,1fr); gap: 2px; }
    .mini-lanes i { height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
    .mini-lanes i::after { content: ""; display: block; width: var(--w); height: 100%; background: var(--accent); }
    .size { color: var(--muted); font-size: 9.5px; }
    .kit-inspector {
      width: 286px; flex: 0 0 286px; padding: 18px 17px;
      display: flex; flex-direction: column;
      border-left: 1px solid var(--line); background: var(--surface);
    }
    .inspector-head { display: flex; align-items: center; justify-content: space-between; color: var(--faint); font-size: 9.5px; }
    .inspector-file { margin-top: 17px; }
    .inspector-file h2 { margin: 0; font-size: 16px; line-height: 1.35; font-weight: 610; letter-spacing: -.015em; }
    .inspector-file p { margin: 6px 0 0; color: var(--muted); font-size: 10px; }
    .connection-block { margin-top: 17px; padding: 12px 0; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line); }
    .connection-block h3 { margin: 0 0 11px; color: var(--faint); font-size: 9.5px; font-weight: 620; }
    .conn-bars { height: 42px; display: flex; align-items: end; gap: 4px; }
    .conn-bars i { flex: 1; height: var(--h); background: var(--accent); opacity: var(--o); }
    .kv-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0; color: var(--muted); font-size: 10px; }
    .kv-row b { color: var(--text); font-weight: 540; }
    .kit-actions { margin-top: auto; display: grid; gap: 6px; }
    .kit-note { margin-top: 14px; color: var(--faint); font-size: 9px; line-height: 1.5; }

    /* Variant 2: Current Air */
    .air-top {
      height: 58px; flex: 0 0 58px; display: flex; align-items: center; gap: 24px;
      padding: 0 30px; border-bottom: 1px solid var(--line); background: var(--surface);
    }
    .air-top .brand { min-width: 130px; }
    .air-nav { align-self: stretch; display: flex; gap: 24px; }
    .air-nav button {
      align-self: stretch; border: 0; border-bottom: 2px solid transparent; padding: 0;
      color: var(--muted); background: transparent; font-size: 11.5px;
    }
    .air-nav button.active { color: var(--text); border-color: var(--accent); font-weight: 600; }
    .air-end { margin-left: auto; display: flex; align-items: center; gap: 13px; }
    .air-main { width: min(1120px, calc(100% - 96px)); margin: 0 auto; padding: 28px 0 20px; min-height: 0; display: flex; flex-direction: column; }
    .air-head { display: flex; align-items: end; justify-content: space-between; gap: 24px; }
    .air-speed-line { display: flex; gap: 14px; align-items: center; color: var(--muted); font-size: 10.5px; }
    .air-speed-line b { color: var(--text); font-family: "Cascadia Mono", "Consolas", monospace; font-size: 18px; font-weight: 500; }
    .air-flow { margin-top: 18px; padding: 14px 0 16px; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line); }
    .air-flow-top { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 20px; align-items: start; }
    .air-file-name { font-size: 20px; line-height: 1.25; font-weight: 610; letter-spacing: -.02em; }
    .air-file-meta { margin-top: 5px; color: var(--muted); font-size: 10px; }
    .air-pct { font-family: "Cascadia Mono", "Consolas", monospace; font-size: 24px; font-weight: 500; }
    .air-master { height: 5px; margin-top: 17px; overflow: hidden; border-radius: 10px; background: var(--line); }
    .air-master span { display: block; width: 61%; height: 100%; background: var(--accent); }
    .air-connection-row { display: flex; align-items: end; gap: 4px; height: 25px; margin-top: 9px; }
    .air-connection-row i { flex: 1; height: var(--h); background: var(--accent); opacity: var(--o); }
    .air-metrics { margin-top: 13px; display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 10px; }
    .air-metrics b { color: var(--text); font-weight: 550; }
    .air-metrics .rule { width: 1px; height: 12px; background: var(--line-strong); }
    .air-actions { display: flex; gap: 7px; margin-top: 14px; }
    .air-list { flex: 1; min-height: 0; margin-top: 12px; overflow: hidden; border-top: 1px solid var(--line); }
    .air-row {
      min-height: 58px; display: grid; grid-template-columns: minmax(280px,1fr) 140px 74px 84px;
      gap: 12px; align-items: center; border-bottom: 1px solid var(--line);
    }
    .air-row.selected { background: var(--selected); }
    .air-empty-note { margin-top: auto; display: flex; justify-content: space-between; color: var(--faint); font-size: 9.5px; }

    /* Variant 3: Current Grid */
    .grid-shell { flex: 1; min-height: 0; display: flex; }
    .grid-rail {
      width: 58px; flex: 0 0 58px; display: flex; flex-direction: column; align-items: center;
      gap: 6px; padding: 12px 0 10px; border-right: 1px solid var(--line); background: var(--primary);
    }
    .grid-rail .mark { width: 29px; height: 29px; margin-bottom: 10px; color: var(--primary); background: var(--primary-text); }
    .rail-icon {
      width: 34px; height: 34px; display: grid; place-items: center;
      border: 1px solid transparent; border-radius: 6px;
      color: color-mix(in srgb, var(--primary-text) 57%, transparent); background: transparent;
    }
    .rail-icon.active { color: var(--primary-text); border-color: color-mix(in srgb, var(--primary-text) 20%, transparent); background: color-mix(in srgb, var(--primary-text) 12%, transparent); }
    .rail-icon.bottom { margin-top: auto; }
    .grid-main { flex: 1; min-width: 0; min-height: 0; padding: 18px 19px 14px; display: flex; flex-direction: column; background: var(--bg); }
    .grid-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .segmented { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; background: var(--surface); }
    .segmented button { height: 28px; border: 0; border-right: 1px solid var(--line); padding: 0 9px; color: var(--muted); background: transparent; font-size: 9.5px; }
    .segmented button:last-child { border-right: 0; }
    .segmented button.active { color: var(--text); background: var(--panel); font-weight: 600; }
    .grid-status { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 10px; }
    .grid-status b { color: var(--text); font-weight: 550; }
    .grid-content { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0,1fr) 270px; gap: 17px; margin-top: 14px; }
    .grid-table { min-width: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--surface); }
    .grid-head, .grid-row {
      display: grid; grid-template-columns: minmax(220px,1fr) 138px 66px 78px;
      gap: 10px; align-items: center; padding: 0 11px;
    }
    .grid-head { height: 31px; color: var(--faint); background: var(--panel); border-bottom: 1px solid var(--line); font-size: 9px; }
    .grid-row { min-height: 54px; border-bottom: 1px solid var(--line); }
    .grid-row.selected { background: var(--selected); box-shadow: inset 2px 0 var(--accent); }
    .grid-row .file-name { font-size: 11px; }
    .grid-row .file-sub { font-size: 9px; }
    .grid-progress { display: grid; gap: 5px; }
    .grid-progress .progress-top { font-size: 8.8px; }
    .grid-progress .segments { display: flex; gap: 2px; }

    function renderTabs() {
      document.getElementById("variants").innerHTML = Object.entries(variants).map(([key,v])=>`
        <button class="variant ${key===state.variant?"active":""}" data-variant="${key}" aria-pressed="${key===state.variant}">
          <span class="variant-index">${v.letter}</span><span class="variant-copy"><strong>${v.name}</strong><span>${v.short}</span></span><span class="library">${v.lib}</span>
        </button>`).join("");
    }
    function renderControls() {
      document.getElementById("screens").innerHTML = [["main","主窗口"],["settings","设置"],["add","新建下载"]].map(([k,label])=>`<button class="screen-tab ${state.screen===k?"active":""}" data-screen="${k}" aria-pressed="${state.screen===k}">${label}</button>`).join("");
      document.getElementById("themes").innerHTML = `<button class="theme-button ${state.theme==="light"?"active":""}" data-theme="light" aria-pressed="${state.theme==="light"}">${icon("sun",13)}<span>浅色</span></button><button class="theme-button ${state.theme==="dark"?"active":""}" data-theme="dark" aria-pressed="${state.theme==="dark"}">${icon("moon",13)}<span>暗色</span></button>`;
    }
    function renderCanvas() {
      const fn = {
        "kit:main":kitMain,"kit:settings":kitSettings,"kit:add":kitAdd,
        "air:main":airMain,"air:settings":airSettings,"air:add":airAdd,
        "grid:main":gridMain,"grid:settings":gridSettings,"grid:add":gridAdd
      }[`${state.variant}:${state.screen}`];
      document.getElementById("canvas").innerHTML = fn();
      document.querySelectorAll(".switch").forEach(sw=>sw.addEventListener("click",()=>sw.classList.toggle("on")));
      document.querySelectorAll(".seg").forEach(sw=>sw.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{sw.querySelectorAll("button").forEach(x=>x.classList.remove("active"));b.classList.add("active")})));
    }
    function render() { renderTabs(); renderControls(); renderCanvas(); }
    document.addEventListener("click",event=>{
      const variant=event.target.closest("[data-variant]");
      if(variant){state.variant=variant.dataset.variant;render();return}
      const screen=event.target.closest("[data-screen]");
      if(screen){state.screen=screen.dataset.screen;render();return}
      const theme=event.target.closest("[data-theme]");
      if(theme){state.theme=theme.dataset.theme;render()}
    });
    const params=new URLSearchParams(location.search);
    if(variants[params.get("variant")]) state.variant=params.get("variant");
    if(["main","settings","add"].includes(params.get("screen"))) state.screen=params.get("screen");
    if(["light","dark"].includes(params.get("theme"))) state.theme=params.get("theme");
    if(params.get("export")==="1") document.body.classList.add("export");
    render();
