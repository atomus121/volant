<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>白工位 · 设置</title>
  <link rel="stylesheet" href="common.css">
  <style>
    body { background: #eeeeee; }
    .app-window { width: 780px; height: 610px; }
    .body { flex: 1; min-height: 0; display: flex; }
    .rail { width: 58px; flex: 0 0 58px; display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 13px 0; color: #ffffff; background: #111213; }
    .rail .v-mark { width: 30px; height: 30px; margin-bottom: 11px; color: #111213; background: #ffffff; }
    .rail button { width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 7px; color: #aeb2b4; background: transparent; }
    .rail button.active { color: #ffffff; background: #333637; }
    .rail button:last-child { margin-top: auto; }
    .settings { flex: 1; min-width: 0; padding: 24px 28px 18px; display: flex; flex-direction: column; background: #ffffff; }
    .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding-bottom: 16px; }
    h1 { margin: 0; font-size: 24px; line-height: 1.15; font-weight: 630; letter-spacing: -.02em; }
    .head p { margin: 6px 0 0; color: #6b7074; font-size: 11px; }
    .profile { display: flex; align-items: center; gap: 7px; color: #6b7074; font-size: 10.5px; }
    .profile::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #2d6a52; }
    .group { border-top: 1px solid #e1e3e4; padding-top: 12px; margin-top: 8px; }
    .group h2 { margin: 0 0 4px; color: #696e72; font-size: 10px; font-weight: 650; }
    .row { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 24px; border-bottom: 1px solid #eaebec; }
    .row:last-child { border-bottom: 0; }
    .label strong { display: block; color: #17191a; font-size: 12px; font-weight: 580; }
    .label span { display: block; margin-top: 3px; color: #696e72; font-size: 10px; line-height: 1.45; }
    .stepper { display: flex; align-items: center; height: 29px; border: 1px solid #d5d8da; border-radius: 6px; overflow: hidden; background: #ffffff; }
    .stepper button { width: 28px; height: 100%; border: 0; background: transparent; color: #5b6064; }
    .stepper output { width: 32px; color: #151718; font-size: 12px; text-align: center; }
    .select { height: 29px; min-width: 118px; border: 1px solid #d5d8da; border-radius: 6px; padding: 0 8px; color: #232527; background: #ffffff; font-size: 11px; }
    .path { display: flex; gap: 6px; }
    .path input { width: 236px; height: 29px; border: 1px solid #d5d8da; border-radius: 6px; padding: 0 8px; color: #5c6165; background: #ffffff; font-size: 10px; }
    .path button { width: 30px; height: 29px; border: 1px solid #d5d8da; border-radius: 6px; background: #ffffff; }
    .switch { width: 32px; height: 18px; padding: 2px; border: 0; border-radius: 99px; background: #cbd0d2; }
    .switch::after { content: ""; display: block; width: 14px; height: 14px; border-radius: 50%; background: #ffffff; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
    .switch.on { background: #151718; }
    .switch.on::after { transform: translateX(14px); }
    .seg { display: inline-flex; padding: 2px; border: 1px solid #d5d8da; border-radius: 6px; }
    .seg button { height: 23px; border: 0; border-radius: 4px; padding: 0 8px; color: #666c70; background: transparent; font-size: 10px; }
    .seg button.active { color: #111213; background: #eff1f2; }
    .footer { margin-top: auto; height: 36px; display: flex; align-items: center; justify-content: space-between; color: #686e72; font-size: 10px; border-top: 1px solid #e1e3e4; }
    .footer button { border: 0; color: #4f5458; background: transparent; font-size: 10px; }
  </style>
</head>
<body>
  <div class="desktop">
    <div class="app-window window">
      <div class="titlebar"><div class="titlebar-label"><span class="v-mark">V</span><span>Volant · 设置</span></div><div class="win-actions" aria-hidden="true"><span class="win-action"><svg viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor"/></svg></span><span class="win-action"><svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" fill="none" stroke="currentColor"/></svg></span><span class="win-action close"><svg viewBox="0 0 12 12"><path d="m2 2 8 8m0-8-8 8" stroke="currentColor"/></svg></span></div></div>
      <div class="body">
        <aside class="rail" aria-label="设置分类">
          <span class="v-mark">V</span>
          <button class="active" aria-label="下载队列"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg></button>
          <button aria-label="网络连接"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button>
          <button aria-label="浏览器捕获"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 13a5 5 0 0 0 7.54.54l2-2a5 5 0 0 0-7.07-7.07l-1.15 1.15"/><path d="M14 11a5 5 0 0 0-7.54-.54l-2 2a5 5 0 0 0 7.07 7.07l1.15-1.15"/></svg></button>
          <button aria-label="外观"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18"/></svg></button>
          <button aria-label="高级"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
        </aside>
        <main class="settings">
          <div class="head"><div><h1>下载队列</h1><p>设置会立即应用，并写入同一份配置。</p></div><span class="profile">已同步到引擎</span></div>
          <section class="group">
            <h2>并发</h2>
            <div class="row"><div class="label"><strong>同时下载</strong><span>达到上限后，新任务进入等待。</span></div><div class="stepper"><button>−</button><output class="mono">3</output><button>+</button></div></div>
            <div class="row"><div class="label"><strong>每个任务的连接数</strong><span>上限 32；站点拒绝时自动回退。</span></div><div class="stepper"><button>−</button><output class="mono">8</output><button>+</button></div></div>
          </section>
          <section class="group">
            <h2>保存与速度</h2>
            <div class="row"><div class="label"><strong>下载目录</strong><span>不可写时提示错误，不静默切换。</span></div><div class="path"><input class="mono" value="C:\Users\Evan\Downloads"><button aria-label="选择目录"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg></button></div></div>
            <div class="row"><div class="label"><strong>全局限速</strong><span>通过延迟读取控制速度。</span></div><select class="select"><option>不限</option><option>10 MB/s</option></select></div>
            <div class="row"><div class="label"><strong>完成后做种</strong><span>只影响 BitTorrent 任务。</span></div><button class="switch" aria-label="完成后做种"></button></div>
          </section>
          <section class="group">
            <h2>系统集成</h2>
            <div class="row"><div class="label"><strong>监视剪贴板</strong><span>识别 HTTP、HTTPS 与 magnet。</span></div><button class="switch on" aria-label="监视剪贴板"></button></div>
            <div class="row"><div class="label"><strong>删除前确认</strong><span>避免误删未完成任务。</span></div><button class="switch on" aria-label="删除前确认"></button></div>
            <div class="row"><div class="label"><strong>主题</strong><span>所有窗口共用一套语义 token。</span></div><div class="seg"><button class="active">系统</button><button>浅色</button><button>深色</button></div></div>
          </section>
          <div class="footer"><span>配置目录 C:\Users\Evan\AppData\Local\Volant</span><button>恢复默认值</button></div>
        </main>
      </div>
    </div>
  </div>
</body>
</html>
