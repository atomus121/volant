<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>白工位 · 新建下载</title>
  <link rel="stylesheet" href="common.css">
  <style>
    body { background: #eeeeee; }
    .app-window { width: 680px; height: 480px; }
    .body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0,1fr) 230px; background: #ffffff; }
    .main { padding: 25px 26px 20px; display: flex; flex-direction: column; min-width: 0; }
    h1 { margin: 0; font-size: 26px; line-height: 1.2; font-weight: 630; letter-spacing: -.025em; }
    .sub { margin: 7px 0 19px; color: #6e7478; font-size: 11.5px; }
    .source-tabs { height: 32px; display: flex; gap: 20px; border-bottom: 1px solid #e1e3e4; margin-bottom: 12px; }
    .source-tabs button { height: 32px; border: 0; border-bottom: 2px solid transparent; padding: 0; color: #72777b; background: transparent; font-size: 11px; }
    .source-tabs button.active { border-color: #111213; color: #111213; font-weight: 600; }
    .url { height: 37px; display: flex; align-items: center; gap: 8px; border: 1px solid #cfd3d5; border-radius: 7px; padding: 0 10px; background: #ffffff; }
    .url input { flex: 1; min-width: 0; border: 0; outline: 0; color: #222426; background: transparent; font-size: 10.5px; }
    .hint { margin: 7px 0 15px; color: #686e72; font-size: 10px; }
    .probe { border: 1px solid #e0e2e3; border-radius: 8px; overflow: hidden; }
    .probe-head { height: 29px; display: flex; align-items: center; justify-content: space-between; padding: 0 11px; border-bottom: 1px solid #e5e7e8; background: #fafbfb; color: #666c70; font-size: 10px; }
    .probe-row { display: flex; align-items: center; gap: 10px; padding: 12px; }
    .file-icon { width: 27px; height: 30px; display: grid; place-items: center; color: #5c6165; }
    .file-name { color: #141617; font-size: 11px; font-weight: 580; }
    .file-source { margin-top: 4px; color: #666c70; font-size: 9.5px; }
    .probe-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; border-top: 1px solid #e8e9ea; }
    .probe-meta span { display: block; color: #646a6e; font-size: 9px; }
    .probe-meta b { display: block; margin-top: 4px; color: #242627; font-size: 10px; font-weight: 550; }
    .side { padding: 24px 18px 18px; border-left: 1px solid #dfe2e3; background: #fbfcfc; display: flex; flex-direction: column; }
    .side h2 { margin: 0 0 12px; font-size: 10px; font-weight: 650; }
    .path { padding: 10px; border: 1px solid #d7dbdd; border-radius: 7px; color: #565c60; background: #ffffff; font-size: 9.5px; line-height: 1.5; overflow-wrap: anywhere; }
    .side .row { margin-top: 13px; padding-top: 11px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #e2e4e5; color: #5f6569; font-size: 10px; }
    .switch { width: 32px; height: 18px; padding: 2px; border: 0; border-radius: 99px; background: #cbd0d2; }
    .switch::after { content: ""; display: block; width: 14px; height: 14px; border-radius: 50%; background: #ffffff; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
    .switch.on { background: #151718; }
    .switch.on::after { transform: translateX(14px); }
    .note { margin-top: auto; color: #62686c; font-size: 13px; line-height: 1.5; }
    .footer { height: 52px; flex: 0 0 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px 0 26px; border-top: 1px solid #e2e4e5; background: #ffffff; }
    .footer span { color: #62686c; font-size: 10px; }
    .actions { display: flex; gap: 7px; }
  </style>
</head>
<body>
  <div class="desktop">
    <div class="app-window window">
      <div class="titlebar"><div class="titlebar-label"><span class="v-mark">V</span><span>新建下载</span></div><div class="win-actions" aria-hidden="true"><span class="win-action"><svg viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor"/></svg></span><span class="win-action"><svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" fill="none" stroke="currentColor"/></svg></span><span class="win-action close"><svg viewBox="0 0 12 12"><path d="m2 2 8 8m0-8-8 8" stroke="currentColor"/></svg></span></div></div>
      <div class="body">
        <main class="main">
          <h1>新建下载</h1>
          <p class="sub">粘贴地址后先确认文件，再开始传输。</p>
          <div class="source-tabs"><button class="active">链接</button><button>种子文件</button><button>Magnet</button></div>
          <label class="url">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#62686c" stroke-width="1.7"><path d="M10 13a5 5 0 0 0 7.54.54l2-2a5 5 0 0 0-7.07-7.07l-1.15 1.15"/><path d="M14 11a5 5 0 0 0-7.54-.54l-2 2a5 5 0 0 0 7.07 7.07l1.15-1.15"/></svg>
            <input aria-label="下载链接" value="https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/debian-13.2.0-amd64-netinst.iso">
          </label>
          <div class="hint">探测会复用当前连接，不重复请求文件。</div>
          <section class="probe">
            <div class="probe-head"><span>文件信息</span><span>已确认 · 支持 Range</span></div>
            <div class="probe-row"><span class="file-icon"><svg width="22" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 2h7l4 4v16H7z"/><path d="M14 2v5h5"/></svg></span><div><div class="file-name">debian-13.2.0-amd64-netinst.iso</div><div class="file-source">cdimage.debian.org</div></div></div>
            <div class="probe-meta"><div><span>大小</span><b class="mono">682 MB</b></div><div><span>连接建议</span><b>8</b></div><div><span>续传</span><b>可用</b></div><div><span>预计速度</span><b class="mono">18.7 MB/s</b></div></div>
          </section>
        </main>
        <aside class="side">
          <h2>目标位置</h2>
          <div class="path mono">C:\Users\Evan\Downloads</div>
          <div class="row"><span>断点续传</span><button class="switch on" aria-label="断点续传"></button></div>
          <div class="row"><span>自动开始</span><button class="switch on" aria-label="自动开始"></button></div>
          <div class="note">当前卷剩余 176 GB。保存位置不可写时会保留输入，并提示原因。</div>
        </aside>
      </div>
      <footer class="footer"><span>探测耗时 34 ms</span><div class="actions"><button class="secondary-button">取消</button><button class="primary-button">开始下载</button></div></footer>
    </div>
  </div>
</body>
</html>
