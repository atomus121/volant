<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volant · Dual Theme Studies</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
      --board-bg: #e8eaec;
      --board-surface: #f8f9f9;
      --board-ink: #111416;
      --board-muted: #59626a;
      --board-line: #d4d8db;
      --board-accent: #1d5bc4;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body { min-width: 1180px; overflow: hidden; background: var(--board-bg); color: var(--board-ink); }
    button, input, select { font: inherit; }
    button { color: inherit; }
    svg { display: block; flex: 0 0 auto; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--board-accent);
      outline-offset: 2px;
    }

    .board {
      width: min(1600px, calc(100vw - 36px));
      height: calc(100vh - 36px);
      margin: 18px auto;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 13px;
    }
    .masthead {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      padding: 0 2px;
    }
    .masthead h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.1;
      font-weight: 650;
      letter-spacing: -.025em;
    }
    .masthead p {
      margin: 7px 0 0;
      color: var(--board-muted);
      font-size: 12.5px;
    }
    .meta {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--board-muted);
      font-size: 11px;
      white-space: nowrap;
    }
    .mark {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      border: 1px solid #c9cdd0;
      border-radius: 9px;
      color: #fff;
      background: #15191d;
      font-size: 12px;
      font-weight: 800;
    }
    .direction-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .direction-card {
      appearance: none;
      min-width: 0;
      display: grid;
      grid-template-columns: 40px 1fr auto;
      align-items: center;
      gap: 11px;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 11px;
      color: var(--board-ink);
      background: rgba(250,250,249,.72);
      text-align: left;
      cursor: pointer;
    }
    .direction-card:hover { background: #fff; }
    .direction-card.active { border-color: #a8afb5; background: #fff; box-shadow: 0 5px 17px rgba(22,29,36,.07); }
    .direction-index {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .02em;
    }
    .direction-copy { min-width: 0; }
    .direction-copy strong { display: block; color: #14181b; font-size: 12.5px; font-weight: 650; }
    .direction-copy span {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      color: #6c737a;
      font-size: 10.5px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pair { display: flex; gap: 3px; }
    .pair i { width: 8px; height: 22px; border-radius: 3px; }

    .stage {
      min-height: 0;
      display: grid;
      grid-template-rows: 39px minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid #b9bfc4;
      border-radius: 14px;
      background: #f4f5f5;
    }
    .stage-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 9px 0 12px;
      border-bottom: 1px solid #cfd4d7;
      background: #f8f9f9;
    }
    .screens, .theme-control { display: flex; align-items: center; gap: 3px; }
    .screen-tab, .theme-button {
      height: 28px;
      border: 0;
      border-radius: 6px;
      padding: 0 10px;
      color: #5f6870;
      background: transparent;
      font-size: 11px;
      cursor: pointer;
    }
    .screen-tab:hover, .theme-button:hover { background: rgba(17,20,23,.05); }
    .screen-tab.active, .theme-button.active { color: #15191c; background: #fff; box-shadow: 0 1px 4px rgba(17,22,28,.1); }
    .theme-control { padding-left: 7px; border-left: 1px solid #d6dade; }
    .theme-button { display: flex; align-items: center; gap: 6px; }
    .theme-button span { font-size: 10.5px; }
    .stage-canvas {
      min-height: 0;
      padding: 13px;
      overflow: auto;
      display: grid;
      place-items: stretch;
      background: #dfe2e4;
    }

    .prototype {
      --bg: #fff;
      --chrome: #f8f9fa;
      --surface: #fff;
      --panel: #f4f6f7;
      --text: #111417;
      --muted: #5d666e;
      --faint: #657079;
      --line: #dfe3e6;
      --line-strong: #cbd2d7;
      --primary: #151a1e;
      --primary-text: #fff;
      --accent: #1e5fd3;
      --accent-soft: #e9f0ff;
      --success: #176f57;
      --warning: #8b631f;
      --danger: #b3443f;
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      color: var(--text);
      font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
    }

    .prototype[data-dir="blueprint"][data-theme="dark"] {
      --bg: #0b1119;
      --chrome: #0e151e;
      --surface: #111a24;
      --panel: #17222e;
      --text: #f2f5f7;
      --muted: #a9b4be;
      --faint: #8f9ba7;
      --line: #253240;
      --line-strong: #35475a;
      --primary: #e9f1fb;
      --primary-text: #101721;
      --accent: #7ca5ff;
      --accent-soft: #182a49;
      --success: #67cca7;
      --warning: #e1b56a;
      --danger: #ff8b84;
    }
    .prototype[data-dir="transit"][data-theme="dark"] {
      --bg: #101311;
      --chrome: #151916;
      --surface: #1b201c;
      --panel: #202720;
      --text: #f0f3ee;
      --muted: #b1b8af;
      --faint: #919b91;
      --line: #30392f;
      --line-strong: #465247;
      --primary: #edf4ed;
      --primary-text: #111511;
      --accent: #80d1b1;
      --accent-soft: #19362c;
      --success: #80d1b1;
      --warning: #e2b36d;
      --danger: #ff8e87;
    }
    .prototype[data-dir="folio"][data-theme="dark"] {
      --bg: #141311;
      --chrome: #191816;
      --surface: #1d1c19;
      --panel: #25231f;
      --text: #f3f0ea;
      --muted: #b3aea5;
      --faint: #918c84;
      --line: #38342e;
      --line-strong: #4b463f;
      --primary: #f3f0ea;
      --primary-text: #181613;
      --accent: #9db9ed;
      --accent-soft: #252e40;
      --success: #79bea8;
      --warning: #d9ad6e;
      --danger: #f08d85;
    }

    .app-window {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      color: var(--text);
      background: var(--bg);
      box-shadow: 0 18px 50px rgba(13,18,23,.16), 0 2px 8px rgba(13,18,23,.08);
    }
    .app-window.float { width: auto; height: auto; }
    .titlebar {
      height: 34px;
      flex: 0 0 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 12px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      background: var(--chrome);
      user-select: none;
    }
    .title-name { display: flex; align-items: center; gap: 7px; font-size: 10.5px; font-weight: 600; }
    .mini-mark {
      width: 17px;
      height: 17px;
      display: grid;
      place-items: center;
      border-radius: 4px;
      color: var(--primary-text);
      background: var(--primary);
      font-size: 8px;
      font-weight: 800;
    }
    .win-controls { display: flex; height: 100%; }
    .win-control { width: 39px; display: grid; place-items: center; border-left: 1px solid transparent; }
    .win-control:hover { background: rgba(120,130,140,.12); }
    .win-control.close:hover { color: #fff; background: #c44444; }
    .win-control svg { width: 10px; height: 10px; }

    .btn {
      height: 31px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: 7px;
      padding: 0 11px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn.primary { border: 1px solid var(--primary); color: var(--primary-text); background: var(--primary); }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn.secondary { border: 1px solid var(--line-strong); color: var(--text); background: var(--surface); }
    .btn.secondary:hover { background: var(--panel); }
    .btn.ghost { border: 1px solid transparent; color: var(--muted); background: transparent; }
    .btn.ghost:hover { color: var(--text); background: var(--panel); }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status.active { color: var(--accent); }
    .status.queued { color: var(--faint); }
    .status.paused { color: var(--warning); }
    .status.done { color: var(--success); }
    .status.failed { color: var(--danger); }
    .mono { font-family: "Cascadia Mono", "Consolas", monospace; font-variant-numeric: tabular-nums; }
    .switch {
      width: 32px;
      height: 18px;
      padding: 2px;
      border: 0;
      border-radius: 99px;
      background: var(--line-strong);
      cursor: pointer;
    }
    .switch::after {
      content: "";
      display: block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(0,0,0,.18);
    }
    .switch.on { background: var(--primary); }
    .switch.on::after { transform: translateX(14px); }

    /* Shared rows */
    .file {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .file-icon {
      width: 27px;
      height: 30px;
      display: grid;
      place-items: center;
      flex: 0 0 27px;
      color: var(--faint);
    }
    .file-copy { min-width: 0; }
    .file-name {
      overflow: hidden;
      color: var(--text);
      font-size: 13px;
      font-weight: 580;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-sub {
      margin-top: 3px;
      overflow: hidden;
      color: var(--faint);
      font-size: 10.5px;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .track { height: 3px; overflow: hidden; border-radius: 20px; background: var(--line); }
    .track i { display: block; width: var(--p); height: 100%; background: var(--primary); }

    /* A · Draftline */
    .draftline .toolbar {
      height: 54px;
      flex: 0 0 54px;
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .brand { min-width: 136px; display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 650; }
    .brand-mark {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      border-radius: 5px;
      color: var(--primary-text);
      background: var(--primary);
      font-size: 11px;
      font-weight: 800;
    }
    .tabs { align-self: stretch; display: flex; align-items: center; gap: 22px; }
    .tab {
      align-self: stretch;
      border: 0;
      border-bottom: 2px solid transparent;
      padding: 0;
      color: var(--muted);
      background: transparent;
      font-size: 11.5px;
    }
    .tab.active { color: var(--text); border-color: var(--primary); font-weight: 600; }
    .toolbar-end { margin-left: auto; display: flex; align-items: center; gap: 13px; }
    .draftline .body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 276px; }
    .draft-main { min-width: 0; min-height: 0; padding: 23px 24px 18px; overflow: hidden; }
    .draft-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
    h1 { margin: 0; font-size: 25px; line-height: 1.15; font-weight: 630; letter-spacing: -.02em; }
    .sub { margin: 6px 0 0; color: var(--muted); font-size: 10.5px; line-height: 1.45; }
    .pulse { color: var(--muted); font-size: 10.5px; }
    .pulse b { color: var(--text); font-size: 13px; font-weight: 600; }
    .active-sheet { margin-top: 18px; padding: 15px 0 17px; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line); }
    .sheet-title { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 18px; align-items: start; }
    .sheet-title h2 { margin: 0; font-size: 20px; line-height: 1.25; font-weight: 600; letter-spacing: -.02em; }
    .sheet-title p { margin: 5px 0 0; color: var(--muted); font-size: 10.5px; }
    .pct {
      color: var(--text);
      font-family: "Cascadia Mono", "Consolas", monospace;
      font-size: 24px;
      line-height: 1;
      font-weight: 500;
    }
    .ruler {
      position: relative;
      height: 9px;
      margin-top: 17px;
      overflow: hidden;
      background:
        repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 12px),
        var(--panel);
    }
    .ruler span {
      display: block;
      width: 61%;
      height: 100%;
      background:
        repeating-linear-gradient(90deg, var(--accent) 0 1px, transparent 1px 12px),
        color-mix(in srgb, var(--accent) 35%, var(--bg));
    }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 15px; }
    .metric { padding-right: 17px; border-right: 1px solid var(--line); }
    .metric + .metric { padding-left: 17px; }
    .metric span { display: block; color: var(--faint); font-size: 10.5px; }
    .metric b { display: block; margin-top: 4px; color: var(--text); font-size: 12px; font-weight: 550; }
    .sheet-actions { display: flex; gap: 6px; margin-top: 14px; }
    .queue-head {
      height: 31px;
      display: grid;
      grid-template-columns: minmax(250px, 1fr) 130px 70px 70px;
      align-items: center;
      gap: 12px;
      color: var(--faint);
      font-size: 10.5px;
    }
    .queue-row {
      min-height: 54px;
      display: grid;
      grid-template-columns: minmax(250px, 1fr) 130px 70px 70px;
      align-items: center;
      gap: 12px;
      border-top: 1px solid var(--line);
    }
    .mini-progress { display: grid; grid-template-columns: 1fr 31px; gap: 7px; align-items: center; }
    .mini-progress span { color: var(--muted); font-size: 10.5px; text-align: right; }
    .size { color: var(--muted); font-size: 11px; }
    .draft-rail {
      min-width: 0;
      padding: 20px 18px;
      border-left: 1px solid var(--line);
      background: var(--panel);
    }
    .rail-title { display: flex; align-items: center; justify-content: space-between; color: var(--faint); font-size: 9.5px; }
    .rail-figure { margin-top: 15px; padding: 14px 0 13px; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line); }
    .rail-figure h3 { margin: 0 0 13px; font-size: 10.5px; font-weight: 620; }
    .conn-bars { height: 57px; display: flex; align-items: end; gap: 5px; }
    .conn-bars i { flex: 1; height: var(--h); background: var(--primary); opacity: var(--o); }
    .rail-kv { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; color: var(--muted); font-size: 10px; }
    .rail-kv b { color: var(--text); font-weight: 540; }
    .rail-actions { margin-top: auto; display: grid; gap: 6px; }
    .rail-note {
      margin-top: 17px;
      padding-top: 13px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 9.5px;
      line-height: 1.55;
    }

    /* B · Transit */
    .transit .transit-top {
      height: 58px;
      flex: 0 0 58px;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .transit-nav { display: flex; align-items: center; gap: 19px; }
    .transit-nav button { border: 0; padding: 0; color: var(--muted); background: transparent; font-size: 12px; }
    .transit-nav button.active { color: var(--text); font-weight: 600; }
    .transit-body { flex: 1; min-height: 0; display: flex; }
    .transit-rail {
      width: 164px;
      flex: 0 0 164px;
      padding: 17px 10px 12px;
      border-right: 1px solid var(--line);
      background: var(--chrome);
    }
    .transit-rail .brand { padding: 0 6px 15px; min-width: 0; }
    .rail-btn {
      width: 100%;
      height: 33px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 9px;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      font-size: 11.5px;
      text-align: left;
    }
    .rail-btn.active { color: var(--text); background: var(--panel); border-color: var(--line); }
    .rail-btn .count { margin-left: auto; color: var(--faint); font-size: 9px; }
    .transit-content { flex: 1; min-width: 0; padding: 22px 28px 16px; overflow: hidden; }
    .transit-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; }
    .service-line {
      margin-top: 17px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: center;
      padding: 15px 0 17px;
      border-top: 1px solid var(--line-strong);
      border-bottom: 1px solid var(--line);
    }
    .service-main { min-width: 0; }
    .service-kicker { color: var(--accent); font-size: 10.5px; font-weight: 650; }
    .service-main h2 { margin: 6px 0 0; font-size: 22px; line-height: 1.22; font-weight: 610; letter-spacing: -.025em; }
    .service-source { margin-top: 5px; color: var(--muted); font-size: 11px; }
    .route {
      position: relative;
      height: 42px;
      margin-top: 17px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      align-items: center;
    }
    .route::before {
      content: "";
      position: absolute;
      left: 5px;
      right: 5px;
      top: 50%;
      height: 2px;
      background: var(--line);
    }
    .route::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 50%;
      width: 57%;
      height: 2px;
      background: var(--accent);
    }
    .stop {
      position: relative;
      z-index: 1;
      justify-self: center;
      width: 10px;
      height: 10px;
      border: 2px solid var(--surface);
      border-radius: 50%;
      background: var(--line-strong);
      box-shadow: 0 0 0 1px var(--line);
    }
    .stop.done { background: var(--accent); }
    .stop.live { width: 14px; height: 14px; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .service-side { width: 174px; display: grid; gap: 6px; align-content: center; }
    .service-side .kv { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
    .service-side .kv b { color: var(--text); font-weight: 550; }
    .transit-list { margin-top: 11px; border-top: 1px solid var(--line); }
    .transit-row {
      min-height: 55px;
      display: grid;
      grid-template-columns: minmax(245px,1fr) 175px 75px 88px;
      gap: 14px;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }
    .transit-progress { display: grid; grid-template-columns: 1fr 34px; gap: 8px; align-items: center; }
    .transit-progress span { color: var(--muted); font-size: 9.5px; text-align: right; }
    .bottom-info {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 13px;
      color: var(--muted);
      font-size: 10px;
    }
    .bottom-info b { color: var(--text); font-weight: 550; }
    .bottom-dot { width: 1px; height: 12px; background: var(--line-strong); }

    /* C · Folio */
    .folio .folio-top {
      height: 58px;
      flex: 0 0 58px;
      display: flex;
      align-items: center;
      gap: 26px;
      padding: 0 28px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .folio-nav { align-self: stretch; display: flex; align-items: center; gap: 21px; }
    .folio-nav button { align-self: stretch; border: 0; border-bottom: 2px solid transparent; padding: 0; color: var(--muted); background: transparent; font-size: 11px; }
    .folio-nav button.active { color: var(--text); border-color: var(--accent); font-weight: 600; }
    .folio-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 350px minmax(0,1fr); }
    .folio-index {
      min-height: 0;
      padding: 21px 16px 14px;
      border-right: 1px solid var(--line);
      background: var(--chrome);
      overflow: hidden;
    }
    .folio-index-head { display: flex; align-items: end; justify-content: space-between; padding: 0 8px 15px; }

    function renderDirectionTabs() {
      document.getElementById("direction-row").innerHTML = Object.entries(directions).map(([key,d]) => `
        <button class="direction-card ${key===state.dir?"active":""}" data-dir="${key}" aria-pressed="${key===state.dir}">

          <span class="direction-copy"><strong>${d.name}</strong><span>${d.short}</span></span>
          <span class="pair"><i style="background:${d.light[0]};border:1px solid #c9cdd0"></i><i style="background:${d.light[1]}"></i><i style="background:${d.light[2]}"></i><i style="background:${d.dark[0]}"></i><i style="background:${d.dark[2]}"></i></span>
        </button>`).join("");
    }
    function renderControls() {
      document.getElementById("screen-tabs").innerHTML = [["main","主窗口"],["settings","设置"],["add","新建下载"]].map(([k,label])=>`<button class="screen-tab ${state.screen===k?"active":""}" data-screen="${k}" aria-pressed="${state.screen===k}">${label}</button>`).join("");
      document.getElementById("theme-control").innerHTML = `<button class="theme-button ${state.theme==="light"?"active":""}" data-theme="light" aria-pressed="${state.theme==="light"}">${icon("sun",13)}<span>浅色</span></button><button class="theme-button ${state.theme==="dark"?"active":""}" data-theme="dark" aria-pressed="${state.theme==="dark"}">${icon("moon",13)}<span>暗色</span></button>`;
    }
    function renderStage() {
      const fn = {
        "blueprint:main": blueprintMain,
        "blueprint:settings": settingsBlueprint,
        "blueprint:add": addBlueprint,
        "transit:main": transitMain,
        "transit:settings": settingsTransit,
        "transit:add": addTransit,
        "folio:main": folioMain,
        "folio:settings": settingsFolio,
        "folio:add": addFolio
      }[`${state.dir}:${state.screen}`];
      document.getElementById("stage").innerHTML = fn();
      bindPreviewControls();
    }
    function bindPreviewControls() {
      document.querySelectorAll(".switch").forEach(button => button.addEventListener("click", () => button.classList.toggle("on")));
      document.querySelectorAll(".seg").forEach(group => group.querySelectorAll("button").forEach(button => {
        button.addEventListener("click", () => {
          group.querySelectorAll("button").forEach(sibling => sibling.classList.remove("active"));
          button.classList.add("active");
        });
      }));
    }
    function render() {
      renderDirectionTabs();
      renderControls();
      renderStage();
    }
    document.addEventListener("click", event => {
      const dir = event.target.closest("[data-dir]");
      if (dir) { state.dir = dir.dataset.dir; render(); return; }
      const screen = event.target.closest("[data-screen]");
      if (screen) { state.screen = screen.dataset.screen; render(); return; }
      const theme = event.target.closest("[data-theme]");
      if (theme) { state.theme = theme.dataset.theme; render(); }
    });
    const params = new URLSearchParams(location.search);
    if (directions[params.get("dir")]) state.dir = params.get("dir");
    if (["main","settings","add"].includes(params.get("screen"))) state.screen = params.get("screen");
    if (["light","dark"].includes(params.get("theme"))) state.theme = params.get("theme");
    if (params.get("export") === "1") document.body.classList.add("export");
    render();
  </script>
