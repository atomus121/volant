<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volant · GPUI 界面方向探索</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
      --board-bg: #e9eaec;
      --board-surface: #f8f8f7;
      --board-line: #d7d9dc;
      --board-ink: #14171a;
      --board-muted: #686e76;
      --board-accent: #335fce;
      --shadow: 0 24px 60px rgba(14, 19, 26, .16), 0 4px 12px rgba(14, 19, 26, .08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-width: 1180px;
      min-height: 760px;
      overflow: hidden;
      color: var(--board-ink);
      background:
        linear-gradient(90deg, rgba(255,255,255,.28) 1px, transparent 1px) 0 0 / 32px 32px,
        linear-gradient(rgba(255,255,255,.22) 1px, transparent 1px) 0 0 / 32px 32px,
        var(--board-bg);
    }

    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--board-accent);
      outline-offset: 2px;
    }
    svg { display: block; flex: 0 0 auto; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .board {
      width: min(1600px, calc(100vw - 40px));
      height: calc(100vh - 40px);
      margin: 20px auto;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 16px;
    }

    .masthead {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      padding: 0 2px;
    }
    .masthead h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.1;
      font-weight: 650;
      letter-spacing: -.025em;
    }
    .masthead p {
      margin: 7px 0 0;
      color: var(--board-muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .project-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--board-muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .project-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid #c9ccd0;
      border-radius: 10px;
      background: rgba(255,255,255,.7);
      box-shadow: 0 2px 6px rgba(17, 22, 29, .06);
    }

    .direction-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .direction-card {
      appearance: none;
      min-width: 0;
      display: grid;
      grid-template-columns: 38px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      text-align: left;
      border: 1px solid transparent;
      border-radius: 12px;
      background: rgba(248,248,247,.68);
      color: var(--board-ink);
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }
    .direction-card:hover { background: rgba(255,255,255,.92); }
    .direction-card.active {
      border-color: #9ea6b2;
      background: #fff;
      box-shadow: 0 5px 18px rgba(24, 31, 40, .07);
    }
    .direction-letter {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 700;
    }
    .direction-copy { min-width: 0; }
    .direction-copy strong {
      display: block;
      margin-bottom: 3px;
      color: #14171a;
      -webkit-text-fill-color: #14171a;
      font-size: 13px;
      font-weight: 650;
    }
    .direction-copy span {
      display: block;
      overflow: hidden;
      color: var(--board-muted);
      font-size: 11.5px;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .swatches { display: flex; gap: 3px; }
    .swatch { width: 8px; height: 22px; border-radius: 3px; }

    .workbench {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 274px;
      gap: 16px;
    }
    .stage {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 39px minmax(0, 1fr);
      border-radius: 15px;
      background: rgba(255,255,255,.52);
      border: 1px solid rgba(161, 167, 175, .48);
      overflow: hidden;
    }
    .stage-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px 0 14px;
      border-bottom: 1px solid rgba(164, 170, 178, .55);
      background: rgba(247,248,248,.82);
    }
    .screen-tabs { display: flex; align-items: center; gap: 3px; }
    .screen-tab {
      appearance: none;
      border: 0;
      border-radius: 7px;
      padding: 6px 11px;
      color: #59616b;
      background: transparent;
      font-size: 11.5px;
      cursor: pointer;
    }
    .screen-tab:hover { background: rgba(20, 23, 26, .05); }
    .screen-tab.active {
      color: #171a1e;
      background: #fff;
      box-shadow: 0 1px 4px rgba(17, 22, 29, .1);
    }
    .zoom-note {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #767d86;
      font-size: 10.5px;
    }
    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #46a87e;
      box-shadow: 0 0 0 3px rgba(70,168,126,.13);
    }
    .stage-canvas {
      min-height: 0;
      display: grid;
      place-items: stretch;
      padding: 14px;
      overflow: auto;
      background:
        radial-gradient(circle at 50% 22%, rgba(255,255,255,.52), transparent 56%),
        #dde0e4;
    }

    .notes {
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 18px;
      border-radius: 15px;
      border: 1px solid rgba(161,167,175,.5);
      background: rgba(249,249,248,.84);
      overflow: hidden;
    }
    .notes-kicker {
      margin: 0 0 8px;
      color: #68707a;
      font-size: 11px;
      font-weight: 650;
    }
    .notes h2 {
      margin: 0;
      font-size: 19px;
      line-height: 1.3;
      font-weight: 650;
      letter-spacing: -.02em;
    }
    .notes > section > p {
      margin: 9px 0 0;
      color: #5e666f;
      font-size: 12px;
      line-height: 1.58;
    }
    .note-block { padding-top: 14px; border-top: 1px solid #dfe1e3; }
    .note-block h3 {
      margin: 0 0 9px;
      font-size: 11.5px;
      font-weight: 650;
    }
    .note-block ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 7px;
    }
    .note-block li {
      position: relative;
      padding-left: 15px;
      color: #5c636c;
      font-size: 11.5px;
      line-height: 1.45;
    }
    .note-block li::before {
      content: "";
      position: absolute;
      left: 2px;
      top: .54em;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
      opacity: .65;
    }
    .component-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .component-tag {
      padding: 4px 7px;
      border: 1px solid #d1d4d8;
      border-radius: 6px;
      color: #4e5660;
      background: rgba(255,255,255,.7);
      font-size: 10.5px;
    }
    .verdict {
      margin-top: auto;
      padding: 12px;
      border-radius: 10px;
      color: #eef2f6;
      background: #182028;
      font-size: 11.5px;
      line-height: 1.5;
    }
    .verdict strong { display: block; margin-bottom: 4px; color: #fff; font-size: 12px; }

    /* Shared application mockup shell */
    .prototype {
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      color: var(--fg);
      font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
    }
    .app-window {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 11px;
      border: 1px solid var(--window-border);
      background: var(--bg);
      box-shadow: var(--shadow);
    }
    .app-window.float-window { width: auto; height: auto; }
    .titlebar {
      height: 34px;
      flex: 0 0 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-left: 12px;
      border-bottom: 1px solid var(--line);
      color: var(--fg-muted);
      background: var(--titlebar);
      user-select: none;
    }
    .titlebar-name {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 600;
    }
    .mini-logo {
      display: grid;
      place-items: center;
      width: 17px;
      height: 17px;
      border-radius: 5px;
      color: var(--logo-ink);
      background: var(--logo-bg);
      font-size: 9px;
      font-weight: 800;
      line-height: 1;
    }
    .window-controls { height: 100%; display: flex; }
    .window-control {
      width: 40px;
      display: grid;
      place-items: center;
      border-left: 1px solid transparent;
      background: transparent;
    }
    .window-control:hover { background: var(--hover); }
    .window-control.close:hover { color: #fff; background: #d84747; }
    .window-control svg { width: 10px; height: 10px; }
    .app-body {
      flex: 1;
      min-height: 0;
      display: flex;
      overflow: hidden;
    }
    .rail {
      flex: 0 0 var(--rail-w);
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 16px 12px 12px;
      border-right: 1px solid var(--line);
      background: var(--rail);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 8px 15px;
    }
    .brand-logo {
      display: grid;
      place-items: center;
      width: 27px;
      height: 27px;
      border-radius: 8px;
      color: var(--logo-ink);
      background: var(--logo-bg);
      font-size: 13px;
      font-weight: 780;
      box-shadow: 0 0 0 1px var(--logo-ring);
    }
    .brand-name { font-size: 13px; font-weight: 650; letter-spacing: .01em; }
    .brand-sub { margin-top: 1px; color: var(--fg-faint); font-size: 9.5px; }
    .new-button {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-bottom: 16px;
      border: 0;
      border-radius: 8px;
      color: var(--primary-ink);
      background: var(--primary);
      font-size: 11.5px;
      font-weight: 650;
      cursor: pointer;
      box-shadow: var(--button-shadow);
    }
    .new-button:hover { filter: brightness(1.06); }
    .nav-label {
      padding: 0 8px 7px;
      color: var(--fg-faint);
      font-size: 9.5px;
      font-weight: 650;
    }
    .nav-list { display: grid; gap: 2px; }
    .nav-item {
      height: 31px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 9px;
      border: 0;
      border-radius: 7px;
      color: var(--fg-muted);
      background: transparent;
      font-size: 11.5px;
      text-align: left;
      cursor: pointer;
    }
    .nav-item:hover { color: var(--fg); background: var(--hover); }
    .nav-item.active {
      color: var(--fg);
      background: var(--selected);
      box-shadow: inset 0 0 0 1px var(--selected-border);
    }
    .nav-item .count {
      margin-left: auto;
      color: var(--fg-faint);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }
    .rail-footer { margin-top: auto; display: grid; gap: 5px; }
    .rail-util {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 31px;
      padding: 0 9px;
      border: 0;
      border-radius: 7px;
      color: var(--fg-muted);
      background: transparent;
      font-size: 11.5px;
      cursor: pointer;
      text-align: left;
    }
    .rail-util:hover { color: var(--fg); background: var(--hover); }
    .main-pane {
      flex: 1;
      min-width: 0;
      min-height: 0;
      padding: var(--main-pad);
      display: flex;
      flex-direction: column;
      gap: var(--main-gap);
      background: var(--bg);
    }
    .page-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }
    .page-title {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      font-weight: 630;
      letter-spacing: -.02em;
    }
    .page-subtitle {
      margin-top: 5px;
      color: var(--fg-muted);
      font-size: 10.5px;
    }
    .header-action {
      height: 30px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 11px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      color: var(--fg);
      background: var(--surface);
      font-size: 11px;
      cursor: pointer;
    }
    .header-action:hover { background: var(--hover); }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 7px;
      border-radius: 999px;
      color: var(--status-color);
      background: var(--status-bg);
      font-size: 9.5px;
      font-weight: 600;
      white-space: nowrap;
    }
    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
    }
    .tabular { font-variant-numeric: tabular-nums; }

    /* A · Current */
    [data-direction="flow"] {
      --bg: #101318;
      --surface: #15191f;
      --titlebar: #0d1014;
      --rail: #12161b;
      --hover: #1c2229;
      --selected: #202832;
      --selected-border: #2d3946;
      --line: #222830;
      --line-strong: #2e3640;
      --fg: #edf1f5;
      --fg-muted: #929ca8;
      --fg-faint: #7f8994;
      --primary: #7299ff;
      --primary-ink: #0d1422;
      --logo-bg: #dbe5ff;
      --logo-ink: #18233c;
      --logo-ring: rgba(255,255,255,.05);
      --window-border: #2a3038;
      --button-shadow: 0 7px 18px rgba(46, 88, 185, .22);
      --rail-w: 196px;
      --main-pad: 22px;
      --main-gap: 16px;
      --accent: #7299ff;
      --success: #52d3a3;
      --warning: #e3a94f;
      --danger: #ff8078;
      --track: #272e37;
    }
    .flow .transport-band {
      min-height: 70px;
      display: grid;
      grid-template-columns: 150px 1fr auto;
      align-items: center;
      gap: 20px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #141920;
    }
    .transport-speed {
      display: flex;
      align-items: baseline;
      gap: 6px;
      white-space: nowrap;
    }
    .transport-speed strong {
      font-size: 22px;
      font-weight: 620;
      letter-spacing: -.035em;
    }
    .transport-speed span { color: var(--fg-muted); font-size: 10px; }
    .connection-bars { height: 29px; display: flex; align-items: end; gap: 4px; }
    .connection-bar {
      flex: 1;
      min-width: 4px;
      height: var(--h);
      border-radius: 3px 3px 1px 1px;
      background: linear-gradient(to top, #496ebd, #82a5ff);
      opacity: var(--o);
    }
    .transport-meta {
      display: grid;
      grid-template-columns: auto auto;
      gap: 4px 15px;
      color: var(--fg-muted);
      font-size: 10px;
      text-align: right;
    }
    .transport-meta b { color: var(--fg); font-weight: 600; }
    .queue-frame {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-top: 1px solid var(--line);
    }
    .queue-head {
      height: 31px;
      display: grid;
      grid-template-columns: minmax(210px, 1fr) 146px 74px 74px;
      align-items: center;
      gap: 12px;
      padding: 0 11px;
      color: var(--fg-faint);
      font-size: 9px;
    }
    .flow-row {
      min-height: 59px;
      display: grid;
      grid-template-columns: minmax(210px, 1fr) 146px 74px 74px;
      align-items: center;
      gap: 12px;
      padding: 7px 11px;
      border-top: 1px solid var(--line);
      border-radius: 7px;
      cursor: pointer;
      transition: background 140ms ease;
    }
    .flow-row:hover { background: #14191f; }
    .flow-row.selected { background: var(--selected); }
    .file-cell { min-width: 0; display: flex; align-items: center; gap: 10px; }
    .file-icon {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--fg-muted);
      background: #171c22;
    }
    .file-name {
      overflow: hidden;
      color: var(--fg);
      font-size: 11.5px;
      font-weight: 580;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-note {
      margin-top: 3px;
      overflow: hidden;
      color: var(--fg-faint);
      font-size: 9.5px;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .micro-progress {
      display: grid;
      gap: 5px;
    }
    .micro-progress-top {
      display: flex;
      justify-content: space-between;
      color: var(--fg-faint);
      font-size: 9px;
      font-variant-numeric: tabular-nums;
    }
    .progress-rail {
      height: 3px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--track);
    }
    .progress-fill { height: 100%; width: var(--p); border-radius: inherit; background: var(--bar); }
    .lanes {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 2px;
      margin-top: 4px;
    }
    .lane { height: 3px; border-radius: 2px; background: var(--track); overflow: hidden; }
    .lane::after { content: ""; display: block; height: 100%; width: var(--l); background: var(--accent); opacity: .72; }
    .size-cell { color: var(--fg-muted); font-size: 10px; font-variant-numeric: tabular-nums; }
    .row-status { justify-self: start; }
    .detail-panel {
      flex: 0 0 260px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 20px 18px;
      border-left: 1px solid var(--line);
      background: #12161b;
    }
    .detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--fg-faint);
      font-size: 9.5px;
    }
    .detail-file {
      display: grid;
      justify-items: start;
      gap: 10px;
    }
    .detail-file-icon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--accent);
      background: #171d25;
    }
    .detail-file strong { font-size: 15px; line-height: 1.35; font-weight: 610; }
    .detail-section { padding-top: 14px; border-top: 1px solid var(--line); }
    .detail-section-title {
      margin-bottom: 9px;
      color: var(--fg-faint);
      font-size: 9px;
      font-weight: 650;
    }
    .kv-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 5px 0;
      color: var(--fg-muted);
      font-size: 10px;
    }
    .kv-row b { color: var(--fg); font-weight: 530; }
    .detail-actions { margin-top: auto; display: grid; gap: 7px; }
    .secondary-button {
      height: 31px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      color: var(--fg);
      background: var(--surface);
      font-size: 10.5px;
      cursor: pointer;
    }
    .secondary-button:hover { background: var(--hover); }

    /* B · Ledger */
    [data-direction="ledger"] {
      --bg: #f5f3ee;
      --surface: #fffdf8;
      --titlebar: #eeebe4;
      --rail: #f1eee7;
      --hover: #efede7;
      --selected: #e9efe9;
      --selected-border: #a7c4b7;
      --line: #e0dcd3;
      --line-strong: #cfc9bd;
      --fg: #24231f;
      --fg-muted: #6b6861;
      --fg-faint: #706c63;
      --primary: #246b58;
      --primary-ink: #f7fffc;
      --logo-bg: #225f50;
      --logo-ink: #f7fff9;
      --logo-ring: rgba(0,0,0,.02);
      --window-border: #d1ccc1;
      --button-shadow: 0 4px 12px rgba(43, 74, 61, .13);
      --rail-w: 176px;
      --main-pad: 24px;
      --main-gap: 15px;
      --accent: #246b58;
      --success: #246b58;
      --warning: #9a6c19;
      --danger: #ad4f42;
      --track: #e1ded6;
    }
    .ledger .ledger-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 46px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

          <p class="notes-kicker">方向 ${d.letter} · ${d.thesis}</p>
          <h2>${d.name}</h2>
          <p>${d.why}</p>
        </section>
        <section class="note-block">
          <h3>结构选择</h3>
          <ul>${d.points.map(p => `<li>${p}</li>`).join("")}</ul>
        </section>
        <section class="note-block">
          <h3>GPUI 组件对应</h3>
          <div class="component-tags">${d.tags.map(t => `<span class="component-tag">${t}</span>`).join("")}</div>
        </section>
        <div class="verdict"><strong>设计判断</strong>${d.verdict}</div>
      `;
    }

    function bindPrototypeInteractions() {
      document.querySelectorAll("[data-sim-row]").forEach(row => {
        row.addEventListener("click", () => {
          row.closest(".queue-frame, .ledger-list, .slice-table")?.querySelectorAll("[data-sim-row], .ledger-expansion").forEach(el => {
            if (!el.classList.contains("ledger-expansion")) el.classList.remove("selected");
          });
          row.classList.add("selected");
        });
      });

      document.querySelectorAll(".switch").forEach(sw => {
        sw.addEventListener("click", () => sw.classList.toggle("on"));
      });

      document.querySelectorAll(".segmented button, .source-tab").forEach(tab => {
        tab.addEventListener("click", () => {
          tab.parentElement.querySelectorAll("button").forEach(sibling => sibling.classList.remove("active"));
          tab.classList.add("active");
        });
      });
    }

    function renderAll() {
      renderDirectionCards();
      renderScreenTabs();
      renderPrototype();
      renderNotes();
    }

    document.addEventListener("click", event => {
      const direction = event.target.closest("[data-direction-choice]");
      if (direction) {
        current.direction = direction.dataset.directionChoice;
        renderAll();
        return;
      }
      const screen = event.target.closest("[data-screen-choice]");
      if (screen) {
        current.screen = screen.dataset.screenChoice;
        renderAll();
      }
    });

    const params = new URLSearchParams(location.search);
    if (["flow", "ledger", "slice"].includes(params.get("dir"))) current.direction = params.get("dir");
    if (["main", "settings", "add"].includes(params.get("screen"))) current.screen = params.get("screen");
    renderAll();
  </script>
</body>
</html>
