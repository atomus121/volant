<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Volant 下载捕获</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <div class="brand">
          <img class="mark" src="icons/volant.svg" alt="" width="24" height="24" />
          <div>
            <h1>Volant</h1>
            <p>浏览器下载捕获</p>
          </div>
        </div>
        <span id="version" class="version"></span>
      </header>

      <section id="status" class="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span class="status-copy">
          <strong id="status-title">正在连接 Volant</strong>
          <span id="status-detail">检查原生消息组件…</span>
        </span>
      </section>

      <section id="components" class="components" aria-label="视频组件状态" hidden>
        <div class="components-head">
          <strong>视频组件</strong>
          <button id="open-components" type="button">在 Volant 中准备</button>
        </div>
        <div class="component-row">
          <span>解析器</span>
          <span id="ytdlp-state" class="component-state">未检测</span>
        </div>
        <div class="component-row">
          <span>MP4 合成</span>
          <span id="ffmpeg-state" class="component-state">未检测</span>
        </div>
        <div class="component-row">
          <span>JavaScript 运行时</span>
          <span id="js-runtime-state" class="component-state">未检测</span>
        </div>
      </section>

      <section class="media">
        <div class="section-head">
          <div>
            <h2>当前页面</h2>
            <p id="media-summary">正在检查当前页面…</p>
          </div>
          <button id="refresh" class="icon-button" type="button" aria-label="刷新页面媒体" title="刷新">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M13 5.25V2.5m0 2.75H10.25M13 5.25A5.25 5.25 0 1 0 13.25 10"
                fill="none" stroke="currentColor" stroke-width="1.4"
                stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <div id="media-empty" class="empty">
          播放视频后，这里会出现可下载的媒体；页面播放器上也会显示 Volant 按钮。
        </div>
        <ul id="media-list" aria-label="当前页面媒体"></ul>
        <p id="media-feedback" class="feedback" aria-live="polite" hidden></p>
      </section>

      <div class="settings-block">
        <div class="settings-title">
          <span>浏览器接管</span>
          <small>只影响普通下载</small>
        </div>
        <label class="capture-row">
          <span>
            <strong>捕获下载链接</strong>
            <small>点击后交给 Volant，Cookie 与来源页一并保留</small>
          </span>
          <input id="capture" type="checkbox" role="switch" checked />
        </label>
      </div>

      <footer class="footer">
        <label class="subtitles">
          <input id="subtitles" type="checkbox" />
          保存字幕
        </label>
        <button id="open-app" class="secondary" type="button">打开 Volant</button>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
