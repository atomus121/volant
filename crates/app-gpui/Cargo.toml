[package]
name = "volant-app-gpui"
version = "0.6.16"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

# This crate is excluded from the root workspace while the existing egui
# application remains on windows-gnu. It builds with tools/cargo-gpui.ps1.
[workspace]

[dependencies]
gpui-kit = "=0.9.1"
tokio = { version = "1", features = ["sync"] }
volant-app-core = { path = "../app-core" }
