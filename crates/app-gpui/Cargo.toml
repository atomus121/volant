[package]
name = "volant-app-gpui"
version = "0.6.21"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

# This crate is excluded from the root workspace while the existing egui
# application remains on windows-gnu. It builds with tools/cargo-gpui.ps1.
[workspace]

[dependencies]
gpui-kit = "=0.9.1"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
volant-app-core = { path = "../app-core" }
raw-window-handle = "0.6"

[[bin]]
name = "volant"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
librqbit = "=9.1.0"
volant-torrent = { path = "../torrent" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
